name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Run tests
      run: make test

  build-linux-amd64:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      run: CGO_ENABLED=1 go build -ldflags="-s -w" -o tapa-linux-amd64 ./cmd/tapa
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tapa-linux-amd64
        path: tapa-linux-amd64

  build-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      run: CGO_ENABLED=1 go build -ldflags="-s -w" -o tapa-linux-arm64 ./cmd/tapa
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tapa-linux-arm64
        path: tapa-linux-arm64

  build-darwin-amd64:
    needs: test
    runs-on: macos-14-large
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      run: CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="-s -w" -o tapa-darwin-amd64 ./cmd/tapa
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tapa-darwin-amd64
        path: tapa-darwin-amd64

  build-darwin-arm64:
    needs: test
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      run: CGO_ENABLED=1 GOARCH=arm64 go build -ldflags="-s -w" -o tapa-darwin-arm64 ./cmd/tapa
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tapa-darwin-arm64
        path: tapa-darwin-arm64

  build-windows-amd64:
    needs: test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      shell: bash
      run: CGO_ENABLED=1 go build -ldflags="-s -w" -o tapa-windows-amd64.exe ./cmd/tapa
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tapa-windows-amd64.exe
        path: tapa-windows-amd64.exe

  create-release:
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -type f -exec mv {} release/ \;
        chmod +x release/tapa-* || true
        cd release && sha256sum ./* > checksums.txt
        ls -la
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: release/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
