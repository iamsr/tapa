name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Run tests
      run: make test
    
    - name: Build binaries
      run: |
        mkdir -p dist
        
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/tapa-linux-amd64 ./cmd/tapa
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/tapa-linux-arm64 ./cmd/tapa
        
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/tapa-darwin-amd64 ./cmd/tapa
        
        # macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/tapa-darwin-arm64 ./cmd/tapa
        
        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/tapa-windows-amd64.exe ./cmd/tapa
        
        # Create checksums
        cd dist && sha256sum * > checksums.txt
    
    - name: Generate release notes
      id: release_notes
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          # First release - get all commits
          COMMITS=$(git log --oneline --pretty=format:"- %s" | head -20)
        else
          # Get commits since last tag
          COMMITS=$(git log --oneline --pretty=format:"- %s" ${PREV_TAG}..HEAD)
        fi
        
        # Write release notes to file
        cat > release_notes.md << EOF
        ## What's Changed
        
        ${COMMITS}
        
        ## Installation
        
        ### macOS (Apple Silicon)
        \`\`\`bash
        curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tapa-darwin-arm64 -o tapa
        chmod +x tapa
        sudo mv tapa /usr/local/bin/
        \`\`\`
        
        ### macOS (Intel)
        \`\`\`bash
        curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tapa-darwin-amd64 -o tapa
        chmod +x tapa
        sudo mv tapa /usr/local/bin/
        \`\`\`
        
        ### Linux (AMD64)
        \`\`\`bash
        curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tapa-linux-amd64 -o tapa
        chmod +x tapa
        sudo mv tapa /usr/local/bin/
        \`\`\`
        
        ### Linux (ARM64)
        \`\`\`bash
        curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tapa-linux-arm64 -o tapa
        chmod +x tapa
        sudo mv tapa /usr/local/bin/
        \`\`\`
        
        ### Windows
        Download \`tapa-windows-amd64.exe\` and add to your PATH.
        
        ## Verify Download
        
        \`\`\`bash
        sha256sum -c checksums.txt
        \`\`\`
        EOF
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release_notes.md
        files: |
          dist/tapa-linux-amd64
          dist/tapa-linux-arm64
          dist/tapa-darwin-amd64
          dist/tapa-darwin-arm64
          dist/tapa-windows-amd64.exe
          dist/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
