# DMA (Table Alteration Planning Assistant) Configuration Example
# Copy this file to .tapa.yml and customize for your environment

database:
  # Database connection URL
  url: postgres://localhost/mydb
  # Database type: postgresql, mysql
  type: postgresql

analysis:
  # Disk throughput in MB/s (default: 200 for SSD)
  # Used to estimate table rewrite duration
  disk_throughput_mbps: 200
  
  # Rewrite factor multiplier (default: 2.0)
  # Accounts for indexes, constraints during table rewrites
  rewrite_factor: 2.0
  
  # Fail on risk level threshold for CI/CD (optional)
  # Options: low, medium, high, critical
  # If set, exit code 1 when any operation meets/exceeds this level
  # fail_on_risk_level: high

output:
  # Output format: table, json, or yaml (default: table)
  format: table
  
  # Enable verbose output (default: false)
  verbose: false
